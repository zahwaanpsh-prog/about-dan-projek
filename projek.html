<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata</title>
    <style>
        body {
          font-family: Arial, Helvetica, sans-serif;
          background-color: burlywood;
          color: black;
          margin: 0;
          padding: 20px;
        }
        .container {
            max-width: 600px;
            background: white;
            margin: 0;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2 px 4px rgb(0, 0, 0, 0.1);
        }
        header {
            text-align: center;
            border-bottom: 2px solid;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            color: brown;
        
        }
        section {
            margin-bottom: 20px;
            border-bottom: 1px solid;
            padding-bottom: 15px;
        }
        h2 {
            font-size: 18px;
            color: brown;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
       <header>
         <h1>projek</h1>
       </header>

       <section>
         <h2>projek yang saya buat</h2>
         <li>portofolio</li>
         <li>web sederhana</li>
       </section>
       
</body>
</html>
